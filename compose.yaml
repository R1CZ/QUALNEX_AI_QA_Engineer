# QUALNEX - Docker Compose Configuration
# Modern compose.yaml format (works with docker compose v2+)

services:
  # ============ Frontend (React + Vite) ============
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - VITE_API_URL=http://localhost:8000/api
      - VITE_WS_URL=ws://localhost:8000
    depends_on:
      - api
    networks:
      - qualnex-net
    restart: unless-stopped

  # ============ API Server (FastAPI) ============
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://qualnex:qualnex@postgres:5432/qualnex
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=production
      - DEBUG=false
    env_file:
      - ./backend/.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - qualnex-net
      - qualnex-sandbox
    restart: unless-stopped

  # ============ Background Workers ============
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    command: python -m app.workers.executor
    environment:
      - DATABASE_URL=postgresql+asyncpg://qualnex:qualnex@postgres:5432/qualnex
      - REDIS_URL=redis://redis:6379/0
    env_file:
      - ./backend/.env
    depends_on:
      - api
      - redis
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - qualnex-net
      - qualnex-sandbox
    restart: unless-stopped

  # ============ PostgreSQL Database ============
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qualnex
      POSTGRES_PASSWORD: qualnex
      POSTGRES_DB: qualnex
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qualnex"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - qualnex-net
    restart: unless-stopped

  # ============ Redis Queue ============
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - qualnex-net
    restart: unless-stopped

  # ============ Object Storage (MinIO - S3 compatible) ============
  minio:
    image: minio/minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: qualnex
      MINIO_ROOT_PASSWORD: qualnex123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    networks:
      - qualnex-net
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  qualnex-net:
    driver: bridge
  qualnex-sandbox:
    driver: bridge
    internal: false
